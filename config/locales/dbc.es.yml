# Decidim's proposals wording in Spanish: "aporte", not "propuesta" (D228), mounted into Decidim's
# config/locales beside dbc_wording.en.yml. Only the keys that change are here; everything else is
# Decidim's own. "Aporte" is masculine, so articles, demonstratives and agreeing words change with it
# (la propuesta publicada -> el aporte publicado). Taken from Decidim 0.31.6's own Spanish
# (decidim-proposals, -core, -meetings, -accountability, -budgets, -sortitions, -participatory_processes)
# for every string a participant can see; the admin panel keeps "propuesta" (admin.* and admin_log.*
# keys are left out on purpose: only staff read them). Ngäbere falls back to these (ngabere.rb).
# Decidim's generic help pages about processes and assemblies, which use "propuesta" in its everyday
# sense, are left as they are. Re-check against Decidim's own file on each upgrade (D215): a key
# renamed upstream silently goes back to "propuesta".
#
# Also the labels for a document awaiting a staff check (dbc.document_hold, D227, document_hold.rb).
# Draft: for a Panamanian reader to check (D164).
