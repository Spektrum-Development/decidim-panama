      decidim/proposals/creation_enabled_event: Creación de aportes habilitada
      decidim/proposals/liking_enabled_event: '"Me gusta" activados para aportes'
      decidim/proposals/proposal_mentioned_event: Aporte mencionado
      decidim/proposals/publish_proposal_event: Aporte publicado
      decidim/proposals/voting_enabled_event: Apoyo de aportes habilitado
