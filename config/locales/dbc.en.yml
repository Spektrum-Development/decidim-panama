# Decidim's proposals wording in English: "submission", not "proposal" (D228), mounted into Decidim's
# config/locales beside dbc_wording.es.yml. Only the keys that change are here; everything else is
# Decidim's own. Taken from Decidim 0.31.6's own English for every string a participant can see; the
# admin panel keeps "proposal" (admin.* and admin_log.* keys are left out on purpose). Re-check
# against Decidim's own file on each upgrade (D215): a key renamed upstream silently goes back to
# "proposal".
#
# Also the labels for a document awaiting a staff check (dbc.document_hold, D227, document_hold.rb).
en:
  activemodel:
    attributes:
      close_meeting:
        proposal_ids: Submissions created in the meeting
    models:
      decidim/accountability/proposal_linked_event: Submission included in a result
      decidim/proposals/creation_enabled_event: Submission creation enabled
      decidim/proposals/liking_enabled_event: Submission liking enabled
      decidim/proposals/proposal_mentioned_event: Submission mentioned
      decidim/proposals/publish_proposal_event: Submission published
      decidim/proposals/voting_enabled_event: Submission voting enabled
