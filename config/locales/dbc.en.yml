            budget_text: 'The submission <span class="resource-link">%{link} was created</span>'
            import_from_proposal_text: 'It became this submission: %{link}'
            import_to_proposal_text: 'This submission <span "resource-link">%{link} was created</span>'
            merge_from_proposal_text: 'It became this submission: %{link}'
            merge_to_proposal_text: 'This submission was created: %{link}'
            split_from_proposal_text: 'It became this submission: %{link}'
            split_to_proposal_text: 'This submission was created: %{link}'
